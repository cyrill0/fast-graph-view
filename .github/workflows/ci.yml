name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 9 aborts on this repo's pnpm-workspace.yaml, which carries `allowBuilds`
          # and no `packages` field - a shape only pnpm 10+ accepts.
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
      - run: pnpm build
      - run: pnpm test
